# Rewrite requests to the Plone site using the VirtualHostMonster.

map $http_x_forwarded_proto $vhm_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8002;
    server_name _;

    # Look up the Plone container through Docker's DNS on every request, so a
    # recreated Plone container with a new address is found.
    resolver 127.0.0.11 valid=10s;
    set $plone http://plone:8080;

    location / {
        rewrite ^(.*)$ /VirtualHostBase/$vhm_scheme/$http_host/Plone/VirtualHostRoot$1 break;
        proxy_pass $plone;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
