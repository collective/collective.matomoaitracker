# Varnish (port 8001) -> Nginx VirtualHostMonster (port 8002) -> Plone (port 8003)
name: matomoaitracker

services:
  plone:
    build: .
    environment:
      MATOMO_BASE_URL: ${MATOMO_BASE_URL:-https://matomo.example.com}
      MATOMO_SITE_ID: ${MATOMO_SITE_ID:-1}
      DELETE_EXISTING: ${DELETE_EXISTING:-False}
    ports:
      - "${PLONE_PORT:-8003}:8080"
    volumes:
      - plone-data:/data

  nginx:
    build: nginx
    ports:
      - "${NGINX_PORT:-8002}:8002"
    depends_on:
      - plone

  varnish:
    build: varnish
    environment:
      MATOMO_AI_PLONE_ORIGIN: http://nginx:8002
    ports:
      - "${VARNISH_PORT:-8001}:80"
    depends_on:
      - nginx

volumes:
  plone-data:
